# Oh-My-DeepSeek bundle layer.
#
# Tool rows (ralplan/team/deep_interview_score) register on ctx.tools; the
# skill row registers the deep-interview playbook on ctx.skills. All seams
# (workflowEngine, subagents, tools, systemPrompt, skills) are provided by
# @deepseek-ai/dsh-base, so a default dsh profile + this bundle is enough.
#
# The config below holds defaults. A user's own cordis.patch.yml can override a
# row by `id`; an override replaces the whole `config`, so restate every key.

# ralplan/team depend on ctx.workflowEngine, but the dsh-web-app bundle disables
# `workflow-worker-thread` (its provider) because the Web GUI does not expose
# workflow/ralph tools by default. Re-enable the engine here — this bundle
# registers its own orchestration tools on top of it. `tool-workflow` and
# `tool-ralph` stay disabled; they are unrelated to these plugins.
- id: workflow-worker-thread
  disabled: false

- insert:
    - id: omd-ralplan
      name: 'oh-my-deepseek/ralplan'
      config:
        toolName: ralplan
        maxIterations: 5
        subagentProvider: spawn

    - id: omd-team
      name: 'oh-my-deepseek/team'
      config:
        toolName: team
        maxIterations: 3
        maxSubtasks: 12
        subagentProvider: spawn

    - id: omd-deep-interview-score
      name: 'oh-my-deepseek/deep-interview'
      config:
        toolName: deep_interview_score
        ambiguityThreshold: 0.2

    - id: omd-deep-interview-skill
      name: 'oh-my-deepseek/deep-interview-skill'

    - id: omd-vision
      name: 'oh-my-deepseek/vision'
      config:
        toolName: understand_image
        baseURL: https://open.bigmodel.cn/api/paas/v4
        model: glm-4v-flash
        apiKeyEnv: ZHIPU_API_KEY

    # Vision MCP (community bridge to 6 free vision providers, auto-fallback).
    # Exposes tools under `mcp__vision-mcp__<name>` (e.g. understand, ocr,
    # compare, diagnose, chart, ui_eval). Requires at least one of the env keys
    # (e.g. ZHIPU_API_KEY); the server falls back across configured providers.
    - id: omd-vision-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: vision-mcp
        transport: stdio
        command: npx
        args: ['-y', 'vision-mcp']
        env:
          ZHIPU_API_KEY: !!js process.env.ZHIPU_API_KEY

    - id: omd-exa-search
      name: 'oh-my-deepseek/exa-search'
      config:
        baseURL: https://mcp.exa.ai/mcp
        numResults: 6

# Repoint the model-facing web_search tool at the keyless Exa provider above.
# This is the deployment choice that replaces dsh-base's `deepseek-official`
# pin, so web search works without any DeepSeek search key.
- id: web
  config:
    searchProvider: exa
